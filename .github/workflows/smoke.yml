name: Fumaça em produção

on:
  schedule:
    - cron: '0 */6 * * *' # a cada 6 horas
  workflow_dispatch: {}
  workflow_run:
    workflows: [Deploy]
    types: [completed]

jobs:
  smoke:
    # roda depois de um deploy bem-sucedido, e no agendamento
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes de fumaça contra o site no ar
        run: bash scripts/smoke.sh https://atende-radar.dev.alc.srv.br
