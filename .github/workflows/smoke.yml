name: Fumaça em produção

on:
  schedule:
    - cron: '0 */6 * * *' # a cada 6 horas
  workflow_dispatch: {}
  workflow_run:
    workflows: [Deploy]
    types: [completed]

jobs:
  smoke:
    permissions:
      issues: write
      contents: read
    # roda depois de um deploy bem-sucedido, e no agendamento
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes de fumaça contra o app e o site no ar
        run: bash scripts/smoke.sh https://app.atenderadar.com.br https://atenderadar.com.br

      # I3/T16 · certificado TLS: falha (e abre a issue abaixo) se faltar menos de 15 dias para vencer em algum domínio
      - name: Certificado TLS com pelo menos 15 dias de validade
        if: always()
        run: |
          falhou=0
          for host in app.atenderadar.com.br atenderadar.com.br; do
            cert=$(echo | timeout 20 openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null || true)
            fim=$(printf '%s' "$cert" | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
            if [ -z "$fim" ]; then
              echo "::error::$host: não foi possível ler o certificado TLS"
              falhou=1
              continue
            fi
            dias=$(( ( $(date -d "$fim" +%s) - $(date +%s) ) / 86400 ))
            echo "$host: certificado vence em $fim ($dias dias)"
            if ! printf '%s' "$cert" | openssl x509 -noout -checkend $((15 * 86400)) >/dev/null; then
              echo "::error::$host: certificado vence em $dias dias (mínimo: 15). Verifique a renovação automática."
              falhou=1
            fi
          done
          exit $falhou

      - name: "Abrir/atualizar issue quando falhar (alerta operacional sem depender de e-mail)"
        if: failure()
        uses: actions/github-script@v7
        env:
          TITULO: "ALERTA: fumaça em produção falhou"
        with:
          script: |
            const titulo = process.env.TITULO
            const corpo = `Falhou em ${new Date().toISOString()}. Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: abertas } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'operacao', per_page: 50 })
            const existente = abertas.find((i) => i.title === titulo)
            if (existente) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existente.number, body: corpo })
            } else {
              try { await github.rest.issues.createLabel({ ...context.repo, name: 'operacao', color: 'D93F0B', description: 'Alerta operacional automático' }) } catch {}
              await github.rest.issues.create({ ...context.repo, title: titulo, labels: ['operacao'], body: corpo })
            }
