name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      accept_data_loss:
        description: 'Aceitar avisos de perda de dados do Prisma (só depois de revisar a mudança de schema; o backup do deploy já foi feito)'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Os testes rodam num runner do GitHub (repositório público = sem custo). Se falhar, NADA vai ao ar.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (API + telas, desktop e celular)
        run: bun run test:e2e

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # 2) Só depois de os testes passarem: deploy no servidor (runner próprio).
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, atende-radar]
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to deploy directory
        run: rsync -a --delete --exclude '.env' --exclude 'node_modules' --exclude '.next' ./ /opt/atende-radar/current/

      - name: Install dependencies
        working-directory: /opt/atende-radar/current
        run: /usr/local/bin/bun install

      - name: Backup database (antes de mexer no schema)
        working-directory: /opt/atende-radar/current
        env:
          BACKUP_REQUIRE_DB: 'true'
        run: /usr/local/bin/bun scripts/backup-db.ts

      - name: Prisma generate & sync schema
        working-directory: /opt/atende-radar/current
        run: |
          /usr/local/bin/bun run db:generate
          # Por padrão SEM --accept-data-loss: se a mudança de schema destruiria dados, o deploy falha em vez de apagar.
          # Uma mudança já revisada é liberada disparando o workflow à mão com accept_data_loss=true (fica registrado no histórico).
          if [ "${{ github.event.inputs.accept_data_loss }}" = "true" ]; then
            echo "ATENÇÃO: aplicando com --accept-data-loss (aprovado manualmente)"
            /usr/local/bin/bun run db:push
          else
            /usr/local/bin/bun run db:push:safe
          fi

      - name: Build
        working-directory: /opt/atende-radar/current
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: /usr/local/bin/bun run build

      - name: Restart service
        run: sudo systemctl restart atende-radar.service

      - name: Health check
        run: |
          sleep 3
          curl -sf http://127.0.0.1:3200 > /dev/null
