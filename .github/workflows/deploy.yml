name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Os testes rodam num runner do GitHub (repositório público = sem custo). Se falhar, NADA vai ao ar.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (API + telas, desktop e celular)
        run: bun run test:e2e

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # 2) Só depois de os testes passarem: deploy no servidor (runner próprio).
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, atende-radar]
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to deploy directory
        run: rsync -a --delete --exclude '.env' --exclude 'node_modules' --exclude '.next' ./ /opt/atende-radar/current/

      - name: Install dependencies
        working-directory: /opt/atende-radar/current
        run: /usr/local/bin/bun install

      - name: Backup database (antes de mexer no schema)
        working-directory: /opt/atende-radar/current
        env:
          BACKUP_REQUIRE_DB: 'true'
        run: /usr/local/bin/bun scripts/backup-db.ts

      - name: Prisma generate & sync schema
        working-directory: /opt/atende-radar/current
        run: |
          /usr/local/bin/bun run db:generate
          # Por padrão SEM --accept-data-loss. Se o Prisma avisar de perda de dados, o deploy só continua
          # quando CADA aviso estiver aprovado em .github/approved-schema-changes.txt (aprovação fica no git).
          if /usr/local/bin/bun run db:push:safe > /tmp/db-push.log 2>&1; then
            cat /tmp/db-push.log
          else
            cat /tmp/db-push.log
            grep -E '^  • ' /tmp/db-push.log | sed 's/^  • //' > /tmp/db-warnings.txt || true
            if [ ! -s /tmp/db-warnings.txt ]; then echo "db push falhou por outro motivo"; exit 1; fi
            while IFS= read -r w; do
              if ! grep -qxF "$w" .github/approved-schema-changes.txt; then
                echo "AVISO NÃO APROVADO: $w"
                echo "Revise a mudança e registre-a em .github/approved-schema-changes.txt"
                exit 1
              fi
            done < /tmp/db-warnings.txt
            echo "Todos os avisos estão aprovados no repositório: aplicando com --accept-data-loss"
            /usr/local/bin/bun run db:push
          fi

      - name: Build
        working-directory: /opt/atende-radar/current
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: /usr/local/bin/bun run build

      - name: Restart service
        run: sudo systemctl restart atende-radar.service

      - name: Health check
        run: |
          sleep 3
          curl -sf http://127.0.0.1:3200 > /dev/null
