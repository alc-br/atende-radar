name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Os testes rodam num runner do GitHub (repositório público = sem custo). Se falhar, NADA vai ao ar.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # A suíte inteira num só runner levava ~25 min (um teste por vez). Dividida em 5 runners em paralelo, cada um
    # com seu banco e seu servidor. A divisão é por tipo: as telas (desktop e celular) são o que pesa; dividir só
    # pela contagem de testes deixava um runner com quase todas as telas (21 min) e os outros parados.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, args: "--project=unit --project=api --project=ui-tablet" }
          - { shard: 2, args: "--project=ui-desktop --shard=1/2" }
          - { shard: 3, args: "--project=ui-desktop --shard=2/2" }
          - { shard: 4, args: "--project=ui-mobile --shard=1/2" }
          - { shard: 5, args: "--project=ui-mobile --shard=2/2" }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma client (para o type-check)
        run: bunx prisma generate

      - name: "Migrações (B10): o schema.prisma tem migração para cada mudança"
        if: matrix.shard == 1
        run: bun run db:check

      - name: "Type-check e lint (I1: erro de tipo já derrubou telas em produção)"
        if: matrix.shard == 1
        run: bun run typecheck && bun run lint

      - name: Install browser (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (API + telas, desktop e celular)
        env:
          # Cobrança contra o SANDBOX do Pagar.me (sem as chaves, os testes de cobrança são pulados)
          PAGARME_PUBLIC_KEY_TEST: ${{ secrets.PAGARME_PUBLIC_KEY_TEST }}
          PAGARME_SECRET_KEY_TEST: ${{ secrets.PAGARME_SECRET_KEY_TEST }}
        run: bun run test:e2e ${{ matrix.args }}

      # Vulnerabilidades conhecidas nas dependências (base de avisos do GitHub, via bun.lock).
      # Só high/critical derrubam o deploy; low/moderate não são nem listados.
      # Ignorados (14/10/2026), nenhum roda no app em produção:
      #   GHSA-vfj7-8cjw-p6xm  braces: sem versão corrigida; só no lint (eslint-config-next > fast-glob > micromatch)
      #   GHSA-ggr8-5vv4-36mx  deepmerge-ts: correção só na major 8; o CLI do Prisma fixa 7.1.5
      #   GHSA-86w9-cpqp-85rv  node-forge (20/10/2026): sem versão corrigida (1.4.0 é a última); a falha é na VERIFICAÇÃO
      #                        de assinatura RSA do forge, que não usamos: ele só abre o nosso .p12 da NFS-e e gera o
      #                        certificado dos testes; a assinatura do XML é conferida pelo xml-crypto com o crypto do Node
      - name: "Auditoria de dependências (bun audit: falha só em high/critical)"
        if: matrix.shard == 1
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-ggr8-5vv4-36mx --ignore GHSA-86w9-cpqp-85rv

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 2

  # 1b) Em paralelo: os fluxos que vendem e cobram no Firefox, no Safari (Mac) e no iPhone.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma client
        run: bunx prisma generate

      - name: Install browsers (Firefox e WebKit)
        run: bunx playwright install --with-deps firefox webkit

      - name: E2E Firefox, Safari e iPhone
        env:
          PAGARME_PUBLIC_KEY_TEST: ${{ secrets.PAGARME_PUBLIC_KEY_TEST }}
          PAGARME_SECRET_KEY_TEST: ${{ secrets.PAGARME_SECRET_KEY_TEST }}
        run: bun run test:e2e:browsers

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-browsers
          path: test-results/
          retention-days: 2

  # 2) Só depois de os testes passarem: deploy no servidor (runner próprio).
  deploy:
    needs: [test, browsers]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, atende-radar]
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to deploy directory
        run: rsync -a --delete --exclude '.env' --exclude 'node_modules' --exclude '.next' ./ /opt/atende-radar/current/

      - name: Install dependencies
        working-directory: /opt/atende-radar/current
        run: /usr/local/bin/bun install

      - name: Backup database (antes de mexer no schema)
        working-directory: /opt/atende-radar/current
        env:
          BACKUP_REQUIRE_DB: 'true'
        run: /usr/local/bin/bun scripts/backup-db.ts

      - name: "Ensaio de restauração (o backup recém-feito volta a ser um banco que o app lê)"
        working-directory: /opt/atende-radar/current
        run: /usr/local/bin/bun scripts/restore-drill.ts

      - name: "Prisma generate e migrações do banco (B10)"
        working-directory: /opt/atende-radar/current
        run: |
          /usr/local/bin/bun run db:generate
          # Aplica só as migrações versionadas que faltam (prisma/migrations, revisadas no git). Na 1ª vez, o banco
          # criado pelo antigo `db push` vira baseline SÓ se for igual à 0_init; senão para sem alterar nada.
          # Ver docs/operacao/migracoes.md.
          # Roda com o app no ar: o script grava pelo SQLite esperando o lock (o schema engine do Prisma não consegue
          # enquanto o app mantém o banco aberto). Migrações precisam ser aditivas: o build anterior roda com o schema
          # novo até o restart do fim.
          /usr/local/bin/bun run db:migrate:deploy

      - name: "Catálogo de planos (nome e descrição do código só onde o Admin não editou; preços e assinaturas não mudam)"
        working-directory: /opt/atende-radar/current
        run: /usr/local/bin/bun scripts/sync-plan-catalog.ts

      - name: Build
        working-directory: /opt/atende-radar/current
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          # Domínios separados (site e app): os endereços ficam no servidor e entram no build como NEXT_PUBLIC_*.
          # Sem o arquivo, o sistema roda num domínio só.
          if [ -f /opt/atende-radar/shared/dominios.env ]; then set -a; . /opt/atende-radar/shared/dominios.env; set +a; echo "site: $NEXT_PUBLIC_SITE_URL | app: $NEXT_PUBLIC_APP_URL"; fi
          /usr/local/bin/bun run build

      - name: Variáveis do app (só cria as que faltam; segredos gerados no servidor, nunca vão ao git)
        env:
          PAGARME_PUBLIC_KEY: ${{ secrets.PAGARME_PUBLIC_KEY }}
          PAGARME_SECRET_KEY: ${{ secrets.PAGARME_SECRET_KEY }}
          PAGARME_PUBLIC_KEY_TEST: ${{ secrets.PAGARME_PUBLIC_KEY_TEST }}
          PAGARME_SECRET_KEY_TEST: ${{ secrets.PAGARME_SECRET_KEY_TEST }}
          PAGARME_WEBHOOK_USER: ${{ secrets.PAGARME_WEBHOOK_USER }}
          PAGARME_WEBHOOK_PASS: ${{ secrets.PAGARME_WEBHOOK_PASS }}
          # Voz do tour (Azure Speech, plano F0): docs/operacao/tour-audio.md
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          # E-mail transacional (Brevo) e contatos (Mautic): docs/operacao/email.md
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAUTIC_USUARIO: ${{ secrets.MAUTIC_USUARIO }}
          MAUTIC_SENHA: ${{ secrets.MAUTIC_SENHA }}
          # Conversões pelo servidor (GA4 Measurement Protocol e API de Conversões da Meta): docs/operacao/medicao.md
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: |
          ENVF=/opt/atende-radar/shared/app.env
          add_if_missing() { grep -q "^$1=" "$ENVF" || echo "$1=$2" >> "$ENVF"; }
          # Chaves do Pagar.me e da Azure vêm dos secrets do GitHub (valor nunca impresso); trocar o secret troca no
          # servidor; secret vazio não apaga o que já está lá
          set_from_secret() { [ -n "${!1}" ] || return 0; sed -i "/^$1=/d" "$ENVF"; echo "$1=${!1}" >> "$ENVF"; }
          for v in PAGARME_PUBLIC_KEY PAGARME_SECRET_KEY PAGARME_PUBLIC_KEY_TEST PAGARME_SECRET_KEY_TEST PAGARME_WEBHOOK_USER PAGARME_WEBHOOK_PASS AZURE_SPEECH_KEY AZURE_SPEECH_REGION BREVO_API_KEY MAUTIC_USUARIO MAUTIC_SENHA GA4_API_SECRET META_CAPI_TOKEN; do set_from_secret "$v"; done
          add_if_missing MAUTIC_URL https://mautic.alc.srv.br
          # medição (IDs públicos, criados em 20/10/2026): GTM no site e no app, GA4 e pixel da Meta
          add_if_missing GTM_ID GTM-P43TS3SF
          add_if_missing GA4_MEASUREMENT_ID G-1KVLT8H1ZP
          add_if_missing META_PIXEL_ID 1795760021571040
          # entre aspas: o app.env também é lido por ". app.env" nos passos do deploy, e "<" sem aspas quebra o shell
          # (o systemd tira as aspas). Corrige o valor antigo, gravado sem aspas.
          sed -i -E 's/^MAIL_FROM=([^"].*)$/MAIL_FROM="\1"/' "$ENVF"
          add_if_missing MAIL_FROM '"AtendeRadar <nao-responda@atenderadar.com.br>"'
          # caixa de suporte e vendas (chamados e pedidos de troca de plano); o contato público do site fica em dominios.env
          add_if_missing SUPPORT_EMAIL contato@atenderadar.com.br
          add_if_missing SALES_EMAIL contato@atenderadar.com.br
          # restos do Resend (trocado pelo Brevo)
          sed -i '/^RESEND_API_KEY=/d' "$ENVF"
          # Liga o envio pelo Brevo só se o domínio do remetente estiver autenticado lá (conferido daqui: a conta só aceita o
          # IP do servidor). MAIL_PROVIDER=off no app.env desliga de propósito e o deploy respeita.
          CUR_MAIL=$(sed -n 's/^MAIL_PROVIDER=//p' "$ENVF" | tail -1)
          if [ "$CUR_MAIL" != "off" ] && [ "$CUR_MAIL" != "brevo" ]; then
            if ( set -a; . "$ENVF"; set +a; cd /opt/atende-radar/current && /usr/local/bin/bun scripts/mail-check.ts ); then
              sed -i '/^MAIL_PROVIDER=/d' "$ENVF"; echo "MAIL_PROVIDER=brevo" >> "$ENVF"; echo "envio de e-mail ligado (Brevo)"
            else
              echo "::warning::E-mail continua na fila: o Brevo ainda não aceita o remetente (veja a saída do mail-check)"
            fi
          fi
          # test = sandbox; muda para live no servidor quando a conta de produção estiver liberada
          add_if_missing PAGARME_MODE test
          add_if_missing GATEWAY_SECRET "$(openssl rand -hex 32)"
          add_if_missing PHONE_HASH_SECRET "$(openssl rand -hex 32)"
          add_if_missing WHATSAPP_GATEWAY on
          # Ambiente de simulação (docs/operacao/simulacao.md): desligado por padrão em todo servidor. Ligar (on) é decisão
          # do dono, editando o app.env no servidor; o deploy nunca muda um valor que já existe. SIMULATION_SECRET (acesso
          # do CLI/agente pela API) não é criado aqui: sem ele, só o operador logado usa a aba Simulação.
          add_if_missing SIMULATION_ENABLED off
          # 15/10/2026: o dono decidiu ligar a aba Simulação no Admin (sem SIMULATION_SECRET). Feito uma vez só: se depois
          # alguém voltar para off no servidor, o deploy não liga de novo.
          if [ ! -f /opt/atende-radar/shared/.simulation-on-2026-10-15 ]; then
            sed -i 's/^SIMULATION_ENABLED=.*/SIMULATION_ENABLED=on/' "$ENVF" && touch /opt/atende-radar/shared/.simulation-on-2026-10-15
          fi
          add_if_missing WA_SESSIONS_DIR /opt/atende-radar/wa-sessions
          mkdir -p /opt/atende-radar/wa-sessions && chmod 700 /opt/atende-radar/wa-sessions
          # Chave que cifra as credenciais do WhatsApp em disco (docs/operacao/sessoes-whatsapp.md).
          # No primeiro deploy com a chave, guarda antes uma cópia das sessões como estavam (texto puro) para voltar atrás.
          # a cópia em texto puro de antes da cifra não é mais necessária (decisão do dono, 15/10/2026)
          if grep -q "^WA_SESSIONS_KEY=" "$ENVF"; then rm -f /opt/atende-radar/backups/wa-sessions-pre-cifra-*.tar.gz; fi
          if ! grep -q "^WA_SESSIONS_KEY=" "$ENVF"; then
            mkdir -p /opt/atende-radar/backups
            PRE=/opt/atende-radar/backups/wa-sessions-pre-cifra-$(date +%Y%m%d-%H%M%S).tar.gz
            (umask 077 && tar -czf "$PRE" -C /opt/atende-radar wa-sessions)
            tar -tzf "$PRE" > /dev/null
            echo "sessões do WhatsApp guardadas em $PRE"
          fi
          add_if_missing WA_SESSIONS_KEY "$(openssl rand -base64 32)"
          # Cache do áudio do tour: fora de current/ (o rsync --delete não apaga) e compartilhado por todos os usuários
          add_if_missing TOUR_AUDIO_DIR /opt/atende-radar/shared/tour-audio
          mkdir -p /opt/atende-radar/shared/tour-audio
          # o warm (usuário do runner) e o serviço gravam aqui; só áudio da narração, nada secreto
          chmod a+rwx /opt/atende-radar/shared/tour-audio 2>/dev/null || echo "::warning::não deu para liberar a pasta do áudio do tour"
          # Foto do perfil e logotipo das empresas (P7): fora de current/ (o rsync --delete não apaga); só o serviço lê e grava
          add_if_missing UPLOADS_DIR /opt/atende-radar/shared/uploads
          mkdir -p /opt/atende-radar/shared/uploads && chmod 750 /opt/atende-radar/shared/uploads
          # Chave do telefone completo cifrado dos contatos (B5/B9, docs/operacao/telefone-cifrado.md). Gerada uma vez
          # aqui e nunca impressa; perder a chave = perder os telefones completos (o resto continua). Guardar cópia fora.
          add_if_missing PHONE_ENC_KEY "$(openssl rand -base64 32)"
          # restos da voz antiga (Piper), que não é mais usada
          sed -i '/^PIPER_BIN=/d; /^PIPER_VOICE=/d' "$ENVF"
          echo "variáveis presentes: $(sed -E 's/=.*//' "$ENVF" | grep -vE '^#|^$' | tr '\n' ' ')"

      - name: "Capacidade do servidor (RAM, CPU e limites do serviço; só leitura, para o drop-in do systemd)"
        continue-on-error: true
        run: |
          nproc; free -m
          systemctl show atende-radar.service -p MemoryCurrent -p MemoryMax -p MemoryHigh -p TasksMax -p Restart

      - name: Restart service
        run: sudo systemctl restart atende-radar.service

      - name: Health check
        run: |
          sleep 3
          curl -sf http://127.0.0.1:3200 > /dev/null

      - name: "Contatos no Mautic (todo membro de empresa real; idempotente; falha só avisa)"
        working-directory: /opt/atende-radar/current
        continue-on-error: true
        run: |
          # Primeiro o catálogo (categoria, campos ar_*, tags, segmentos; só cria o que falta), depois os contatos
          ( set -a; . /opt/atende-radar/shared/app.env; set +a; /usr/local/bin/bun scripts/mautic-setup.ts ) || echo "::warning::Catálogo do Mautic não conferido agora"
          ( set -a; . /opt/atende-radar/shared/app.env; set +a; /usr/local/bin/bun scripts/mautic-sync.ts ) || echo "::warning::Contatos não sincronizados com o Mautic agora (o app sincroniza cada cadastro novo)"

      - name: "Voz do tour: gera o áudio que falta (Azure Speech; só o que não está no cache; falha só avisa)"
        working-directory: /opt/atende-radar/current
        continue-on-error: true
        run: |
          # Mesmas variáveis do serviço (chave, região, TOUR_AUDIO_DIR); a chave nunca é impressa
          ( set -a; . /opt/atende-radar/shared/app.env; set +a; umask 022; /usr/local/bin/bun scripts/tour-audio-warm.ts ) \
            || echo "::warning::Áudio do tour não pré-gerado; ele é gerado no primeiro play (ou o navegador lê)"
