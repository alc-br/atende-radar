name: Backup diário do banco

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 03:00 em Brasília
  workflow_dispatch: {}

jobs:
  backup:
    permissions:
      issues: write
      contents: read
    runs-on: [self-hosted, atende-radar]
    steps:
      - name: Backup database
        working-directory: /opt/atende-radar/current
        env:
          BACKUP_REQUIRE_DB: 'true'
        run: /usr/local/bin/bun scripts/backup-db.ts

      - name: "Abrir/atualizar issue quando falhar (alerta operacional sem depender de e-mail)"
        if: failure()
        uses: actions/github-script@v7
        env:
          TITULO: "ALERTA: backup diário do banco falhou"
        with:
          script: |
            const titulo = process.env.TITULO
            const corpo = `Falhou em ${new Date().toISOString()}. Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: abertas } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'operacao', per_page: 50 })
            const existente = abertas.find((i) => i.title === titulo)
            if (existente) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existente.number, body: corpo })
            } else {
              try { await github.rest.issues.createLabel({ ...context.repo, name: 'operacao', color: 'D93F0B', description: 'Alerta operacional automático' }) } catch {}
              await github.rest.issues.create({ ...context.repo, title: titulo, labels: ['operacao'], body: corpo })
            }
