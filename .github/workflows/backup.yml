name: Backup diário do banco

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 03:00 em Brasília
  workflow_dispatch: {}

jobs:
  backup:
    permissions:
      issues: write
      contents: read
    runs-on: [self-hosted, atende-radar]
    steps:
      - name: Backup database
        working-directory: /opt/atende-radar/current
        env:
          BACKUP_REQUIRE_DB: 'true'
        run: /usr/local/bin/bun scripts/backup-db.ts

      # I3/T16 · este job roda NO servidor (runner próprio): confere o espaço em disco onde ficam o app, o banco e os backups.
      # Falha (e abre a issue abaixo) com 85 % ou mais em uso.
      - name: Espaço em disco do servidor
        if: always()
        run: |
          uso=$(df -P /opt/atende-radar | awk 'NR==2 { gsub("%", "", $5); print $5 }')
          df -h /opt/atende-radar
          if [ -z "$uso" ]; then
            echo "::error::não foi possível ler o uso do disco de /opt/atende-radar"
            exit 1
          fi
          echo "Disco de /opt/atende-radar: ${uso}% em uso"
          if [ "$uso" -ge 85 ]; then
            echo "::error::Disco do servidor com ${uso}% em uso (limite: 85%). Libere espaço (backups antigos, logs) antes que o banco pare de gravar."
            exit 1
          fi

      # I3/T16 · certificado TLS visto do próprio servidor (redundante com a fumaça, que roda a cada 6 h)
      - name: Certificado TLS com pelo menos 15 dias de validade
        if: always()
        run: |
          falhou=0
          for host in app.atenderadar.com.br atenderadar.com.br; do
            cert=$(echo | timeout 20 openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null || true)
            fim=$(printf '%s' "$cert" | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
            if [ -z "$fim" ]; then
              echo "::error::$host: não foi possível ler o certificado TLS"
              falhou=1
              continue
            fi
            echo "$host: certificado vence em $fim"
            if ! printf '%s' "$cert" | openssl x509 -noout -checkend $((15 * 86400)) >/dev/null; then
              echo "::error::$host: certificado vence em menos de 15 dias ($fim). Verifique a renovação automática."
              falhou=1
            fi
          done
          exit $falhou

      - name: "Abrir/atualizar issue quando falhar (alerta operacional sem depender de e-mail)"
        if: failure()
        uses: actions/github-script@v7
        env:
          TITULO: "ALERTA: backup diário do banco falhou"
        with:
          script: |
            const titulo = process.env.TITULO
            const corpo = `Falhou em ${new Date().toISOString()}. Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: abertas } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'operacao', per_page: 50 })
            const existente = abertas.find((i) => i.title === titulo)
            if (existente) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existente.number, body: corpo })
            } else {
              try { await github.rest.issues.createLabel({ ...context.repo, name: 'operacao', color: 'D93F0B', description: 'Alerta operacional automático' }) } catch {}
              await github.rest.issues.create({ ...context.repo, title: titulo, labels: ['operacao'], body: corpo })
            }
