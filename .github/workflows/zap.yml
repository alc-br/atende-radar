name: Varredura de segurança (ZAP)

# Varredura PASSIVA do OWASP ZAP (baseline) no site e no app em produção: lê as páginas e aponta cabeçalhos,
# cookies e configurações inseguras. Não tenta invadir nem cria contas. Relatório fica nos artefatos do job.
on:
  schedule:
    - cron: '30 9 * * 1' # segundas, 06:30 em Brasília
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alvo:
          - https://atenderadar.com.br
          - https://app.atenderadar.com.br/login
    steps:
      - uses: actions/checkout@v4

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ matrix.alvo }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-${{ strategy.job-index }}
